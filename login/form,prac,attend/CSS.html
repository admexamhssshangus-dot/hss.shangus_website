    .login-theme-pill {

        color: var(--text-primary);
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);

    .login-theme-pill:hover {

    }

    .floating-group {
        position: relative;
        margin-bottom: 1rem;
        width: 100%;
    }

    .floating-group input {
        width: 100%;
        /* Global pill styling handles height, radius, and padding */
    }

    .floating-group label {
        position: absolute;
        left: 0.8rem;
        top: 50%;
        transform: translateY(-50%);
        padding: 0 4px;
        color: var(--text-secondary);
        background: transparent;
        font-size: 0.85rem;
        font-weight: 400;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        line-height: 1;
        z-index: 10;
    }

    /* Floating animation - perfectly centered for 30px height */
    .floating-group input:focus+label,
    .floating-group input:not(:placeholder-shown)+label {
        top: 0;
        left: 0.5rem;
        font-size: 0.7rem;
        color: var(--primary);
        font-weight: 600;
        background: var(--bg-card);
        padding: 0 4px;
        transform: translateY(-50%) scale(0.9);
    }

    .floating-group input:not(:focus):not(:placeholder-shown)+label {
        color: var(--text-secondary);
    }

    /* Fix Chrome autofill background breaking floating labels */
    .floating-group input:-webkit-autofill,
    .floating-group input:-webkit-autofill:hover,
    .floating-group input:-webkit-autofill:focus,
    .floating-group input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px var(--bg-card) inset !important;
        -webkit-text-fill-color: var(--text-primary) !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    .floating-group label .required {
        margin-left: 2px;
        color: var(--danger);
    }

    }

    }

    /* --- [MODIFIED] Modal Styles (improved mobile behavior) --- */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        animation: fadeIn 0.2s ease;
        padding: 12px;
        /* allow spacing on small screens */
        overflow-y: auto;
        /* allow modal content to scroll on short viewports */
        -webkit-overflow-scrolling: touch;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }


    .modal-content {
        background: var(--bg-card);
        border-radius: 10px;
        padding: 1.25rem;
        max-width: 380px;
        width: 92%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
        animation: slideUp 0.3s ease;
        position: relative;
        max-height: calc(100vh - 80px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }

    @keyframes slideUp {
        from {
            transform: translateY(20px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    /* --- [NEW] Wide Modal for Subject Editor & Instructions --- */
    .modal-content.wide {
        max-width: 680px;
        text-align: left;
    }

    /* Popup overlay for warnings/toasts */
    .popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20000;
        animation: fadeIn 0.2s ease;
    }

    .popup-content {
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 1.5rem;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 95%;
        width: 460px;
        text-align: left;
        animation: slideUp 0.3s ease;
        border-left: 4px solid var(--primary);
        position: relative;
        max-height: calc(100vh - 80px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }

    .popup-content.wide {
        max-width: 900px;
        width: min(900px, 96%);
    }

    .popup-content .popup-close {
        float: right;
        background: none;
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 6px;
        border-radius: 6px;
    }

    .popup-content p {
        margin: 0.25rem 0;
    }

    /* Close button injected into modal-content */
    .modal-close {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 6px;
        color: var(--text-secondary);
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    @media (max-width: 520px) {

        /* Make header action buttons more compact on small screens */
        #studentDashboardView .dashboard-header>div:last-child {
            gap: 0.35rem;
        }

        #studentDashboardView .btn,
        #studentDashboardView .btn-small {
            padding: 0.22rem 0.45rem;
            font-size: 0.76rem;
        }
    }

    @media (max-width: 420px) {

        }

    .modal-content.wide ul {

        margin-bottom: 1rem;

    }

    .modal-content.wide li {

    }

    .modal-content h3 {

        margin-bottom: 0.5rem;

    }

    .modal-content p {

    }

    .modal-btn.confirm {

    }

        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem;
        margin-top: 0.35rem;
    }

    .checkbox-group label {

        align-items: center;
        margin-bottom: 0;

        cursor: pointer;

    }

    .checkbox-group input[type="checkbox"] {

        margin-right: 0.65rem;
        margin-bottom: 0;

    }

    /* [NEW] Declaration Checkbox */
    .declaration-group {
        padding: 1.25rem;
        background: var(--bg-secondary);
        border-radius: 6px;
        border: 1px solid var(--border);
        transition: all 0.2s ease;
    }

    .declaration-group:hover {
        border-color: var(--primary);

    .subjects-section {
        margin-top: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.75rem;
        background: var(--bg-secondary);

    .subjects-section .group {

        padding: 0.25rem 0;
        border: none;
    }

    .subjects-section .group h5 {
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        color: var(--primary);
    }

    .clear-group {
        font-size: 0.75rem;
        margin-left: 0.5rem;

        text-decoration: underline;
        cursor: pointer;

    }

    .subjects-section .validation-msg {
        font-size: 0.875rem;
        margin-top: 0.5rem;
        padding: 0.5rem;
        border-radius: 4px;
    }

    .validation-msg.error {
        background: var(--danger-light);
        color: var(--danger);
        border: 1px solid var(--danger);
    }

    .validation-msg.success {
        background: var(--success-light);
        color: var(--success);
        border: 1px solid var(--success);
    }

    .validation-msg.info {
        background: var(--info-light);
        color: var(--info);
        border: 1px solid var(--info);
    }

    .validation-msg .count {
        color: var(--primary);
        font-weight: 700;
        margin: 0 0.25rem;
    }

    /* --- [NEW] Admin Toggle Switch --- */
    #admissionToggles {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: space-around;
        margin-top: 0.5rem;
    }

    .toggle-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--border);
        transition: .4s;
        border-radius: 20px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked+.slider {
        background-color: var(--primary);
    }

    input:checked+.slider:before {
        transform: translateX(20px);
    }

    /* --- [MODIFIED] Admin Subjects Editor - Updated for numeric rules --- */
    #subjectsEditor {
        margin-top: 0.5rem;
        /* Reduced */
    }

    /* [NEW] Header row for subject editor */
    .subjects-config-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;

        font-size: 0.85rem;
    }

    #subjectsToggleBtn {

        justify-content: center;

    /* Test Submissions Toggle */

        border-radius: 6px;

    .btn-info {

            border-right: 1px solid var(--border-light) !important;

            border-right: none !important;

            display: none;
        }

            width: 36px !important;

        #adminTabs,
        .pagination,
        #headerPagination,
        .nav-right,
        .nav-tools-row,
        .modal-overlay,
        #loader {
            display: none !important;
        }

        /* 2. Break layout constraints so entire table prints natively on pages */
        html,
        body,
        .dashboard-layout,
        .dashboard-main,
        #adminDashboardView,
        #mainContent,
        #adminApplications,
        .table-responsive,
        .table-container {
            height: auto !important;
            min-height: auto !important;
            max-height: none !important;
            overflow: visible !important;
            display: block !important;
            position: static !important;
            margin: 0 !important;
            padding: 0 !important;
            flex: unset !important;
        }

        /* 3. Disable sticky headers formatting because it breaks pdf/print margins */
        .admin-table th,
        .admin-table td {
            position: static !important;
            white-space: normal !important;
        }

        /* 4. Table properties to fit nicely on paper */
        .admin-table,
        .styled-table {
            width: 100% !important;
            max-width: 100% !important;
            table-layout: auto !important;
            font-size: 8.5pt !important;
            border-collapse: collapse !important;
        }

        thead {
            display: table-header-group !important;
            /* Forces table header on every page break */
        }

        tr {
            page-break-inside: avoid !important;
            /* Keeps table rows together */
        }

        .card {
            box-shadow: none;
            border: 1px solid #ccc;
            page-break-inside: avoid;
        }

        body {
            background: white !important;
            color: black !important;
