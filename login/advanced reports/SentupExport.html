<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <style>
        :root {
            --row-height: 52px;
            --sig-height: 40px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: 0.1px;
            margin: 0;
            padding: 0;
            background: #f4f7f6;
            color: #1a202c;
            font-weight: 500;
        }

        .page-container {
            width: 355.6mm;
            /* Legal Landscape */
            margin: 10mm auto;
            background: white;
            padding: 2mm 10mm 5mm;
            /* Reduced padding */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            box-sizing: border-box;
            page-break-after: auto;
            page-break-inside: avoid;
            min-height: auto;
        }

        @media print {
            @page {
                margin: 5mm;
            }

            /* Minimal browser margin */
            body {
                background: white;
            }

            .page-container {
                margin: 0;
                box-shadow: none;
                width: 355.6mm;
                height: auto;
                padding: 2mm 10mm 5mm;
                /* 0.2cm top margin, reduced bottom margin */
                border: none;
                page-break-after: always;
            }

            .page-container:last-child {
                page-break-after: auto;
            }

            .no-print,
            .no-print-toolbar {
                display: none !important;
            }
        }

        /* Dynamic Theme Classes */
        .theme-11 {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --bg-light: #ebf5fb;
            --accent: #ffffff;
        }

        .theme-12 {
            --primary: #800000;
            --primary-dark: #660000;
            --bg-light: #fff5f5;
            --accent: #ffffff;
        }

        .theme-yellow {
            --primary: #f1c40f;
            --primary-dark: #d4ac0d;
            --bg-light: #fef9e7;
            --accent: #2c3e50;
        }

        .theme-green {
            --primary: #219150;
            --primary-dark: #1e8449;
            --bg-light: #eafaf1;
            --accent: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: #d63031;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .header .sub-title {
            margin: 2px 0 0;
            font-weight: 700;
            color: #2d3436;
            font-size: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            table-layout: fixed;
            margin-bottom: 10px;
        }

        th {
            background: var(--primary);
            color: var(--accent);
            padding: 8px 4px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 800;
            border: 1.5px solid #2d3436;
            font-size: 11px;
        }

        tbody tr:nth-child(even) {
            background: var(--bg-light);
        }

        td {
            padding: 2px 4px;
            border: 1.5px solid #2d3436;
            vertical-align: middle;
            word-wrap: break-word;
            overflow: hidden;
            text-align: left;
            font-weight: 500;
        }

        .page-title {
            position: absolute;
            top: 7mm;
            left: 10mm;
            font-size: 0.6rem;
            color: #718096;
            font-weight: 600;
        }

        .manual-page-circle {
            position: absolute;
            top: 5mm;
            right: 10mm;
            width: 8mm;
            height: 8mm;
            border: 1.5px solid #2d3436;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-cell {
            width: 42px;
            text-align: center;
            padding: 0 !important;
            overflow: hidden;
            height: 1px;
            line-height: 0;
            font-size: 0;
        }

        .photo-cell img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            border: none;
            background: white;
            display: block;
            margin: 0;
            padding: 0;
        }

        .sig-box-cell {
            position: relative;
            height: var(--sig-height);
            text-align: left;
            font-size: 8px;
            vertical-align: bottom;
            padding-bottom: 5px;
        }

        .sig-line-small {
            border-top: 1px solid #2d3436;
            width: 80%;
            margin: 5px auto 0;
        }

        .footer-sigs {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            padding: 0 80px;
        }

        .sig-box {
            text-align: center;
            width: 160px;
        }

        .sig-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: capitalize;
            color: #d63031;
            border-top: 1.5px solid #d63031;
            padding-top: 4px;
            margin-top: 40px;
            /* Signature Space */
            display: block;
        }

        .no-print-toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2d3436;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }

        .adm-no-small {
            font-size: 9px;
            color: #555;
            display: block;
            margin-top: 2px;
        }

        .receipt-cell {
            text-align: left;
            font-size: 7.5px;
            line-height: 1.2;
            padding: 4px;
        }

        .receipt-item {
            margin-bottom: 8px;
        }

        .receipt-item b {
            display: block;
            border-bottom: 0.5px solid #ccc;
            margin-bottom: 2px;
        }

        /* Resizer styles */
        th {
            position: relative;
        }

        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            cursor: col-resize;
            user-select: none;
            height: 100%;
            z-index: 10;
        }

        .resizer:hover {
            background: rgba(72, 187, 120, 0.5);
        }

        .resizing {
            border-right: 2px solid #48bb78 !important;
        }

        /* Row Resizer */
        .row-resizer {
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 6px;
            cursor: row-resize;
            z-index: 100;
        }

        .row-resizer:hover {
            background: rgba(72, 187, 120, 0.4);
        }

        .row-resizing td {
            border-bottom: 2px solid #48bb78 !important;
        }

        @media print {

            .resizer,
            .row-resizer {
                display: none;
            }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: 'Outfit', sans-serif;
        }

        .loading-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 420px;
            border-top: 5px solid #3498db;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 25px 0 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #06b6d4);
            width: 0%;
            transition: width 0.4s ease;
        }

        .loading-card h2 {
            margin: 0;
            color: #1a365d;
            font-size: 1.5rem;
        }

        .loading-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 10px 0 0;
        }
    </style>
</head>

<body id="mainBody">
    <div class="no-print-toolbar no-print">
        <div style="display: flex; align-items: center; gap: 20px;">
            <strong id="toolbarTitle">Sentup Export</strong>
            <div class="zoom-controls">
                <span>Zoom:</span>
                <input type="range" min="0.5" max="1.5" step="0.05" value="1" oninput="updateZoom(this.value)">
                <span id="zoomVal">100%</span>
            </div>
        </div>
        <button onclick="resetLayout()"
            style="background: #e17055; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; cursor: pointer; margin-right:10px;">Reset
            Layout</button>
        <button onclick="window.print()"
            style="background: #00b894; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; cursor: pointer;">Print
            Sentup List</button>
    </div>

    <div style="height: 50px;" class="no-print"></div>

    <div id="print-root"></div>

    <div id="loader" class="loading-overlay">
        <div class="loading-card">
            <h2 id="loaderTitle">Generating Sentup List...</h2>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div
                style="display:flex; justify-content:space-between; font-size:11px; color:#3498db; font-weight:700; margin-bottom:5px;">
                <span id="loaderPercent">0%</span>
                <span id="loaderStatusText">Processing...</span>
            </div>
            <p id="loaderStatus">Fetching student data and applying class theme. Please wait.</p>
        </div>
    </div>

    <script>
        window.onload = function () {
            generate();
        };

        function generate() {
            const urlParams = new URLSearchParams(window.location.search);
            const session = urlParams.get('session');
            const className = urlParams.get('class');

            if (!session || !className) return;

            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            updateProgress(10, "Connecting...");

            let prog = 10;
            const interval = setInterval(() => {
                if (prog < 90) {
                    prog += Math.random() * 8;
                    if (prog > 90) prog = 90;
                    updateProgress(prog, "Fetching student data...");
                }
            }, 400);

            google.script.run
                .withSuccessHandler(data => {
                    clearInterval(interval);
                    updateProgress(100, "Finalizing...");
                    setTimeout(() => {
                        init(data.students, data.session, data.className, data.schoolName);
                        loader.style.display = 'none';
                    }, 500);
                })
                .withFailureHandler(err => {
                    clearInterval(interval);
                    updateProgress(0, "ERROR");
                    loaderTitle.textContent = "Generation Failed";
                    progressStatus.textContent = "Error: " + err.message;
                    progressStatus.style.color = "#e53e3e";
                    console.error("Sentup Data Fetch Error:", err);
                })
                .getSentupData(session, className);
        }

        function updateProgress(val, status) {
            const p = Math.round(val);
            document.getElementById('progressBar').style.width = p + '%';
            document.getElementById('loaderPercent').textContent = p + '%';
            if (status) document.getElementById('loaderStatusText').textContent = status;
        }

        function updateZoom(val) {
            const root = document.getElementById('print-root');
            root.style.transform = `scale(${val})`;
            root.style.transformOrigin = 'top center';
            document.getElementById('zoomVal').textContent = Math.round(val * 100) + '%';
        }

        function init(students, session, className, schoolName) {
            const root = document.getElementById('print-root');
            root.innerHTML = '';
            document.getElementById('toolbarTitle').textContent = "Sentup: " + className + " (" + session + ")";

            // Apply Theme
            const body = document.getElementById('mainBody');
            const cls = className.toUpperCase();
            const sess = session.toUpperCase();
            // Set theme based on session or class
            if (sess.indexOf('APR/BIAN') !== -1) body.className = 'theme-yellow';
            else if (cls.indexOf('11') !== -1) body.className = 'theme-11';
            else if (cls.indexOf('12') !== -1) body.className = 'theme-12';
            else body.className = 'theme-green';

            const STUDENTS_PER_PAGE = 10; // 10 per page for high density matching Admission Register
            const chunks = [];
            for (let i = 0; i < students.length; i += STUDENTS_PER_PAGE) {
                chunks.push(students.slice(i, i + STUDENTS_PER_PAGE));
            }

            chunks.forEach((chunk, idx) => {
                const p = document.createElement('div');
                p.className = 'page-container';

                // Header text logic
                let mainTitle = "Regular Sent up";
                if (sess.indexOf('BIAN') !== -1 || sess.indexOf('PVT') !== -1) mainTitle = "Private/Biannual Sent up";

                const pageNum = idx + 1;

                p.innerHTML = `
                    <div class="page-title">${pageNum}</div>
                    <div class="manual-page-circle"></div>
                    <div class="header">
                        <h1>${schoolName}</h1>
                        <div class="sub-title">${mainTitle} of class ${className} for the session ${session}</div>
                    </div>
                    <table>
                        <thead>
                            <tr style="background:var(--primary); color:var(--accent);">
                                <th style="width:45px" data-default-width="45px">S.No.<br><span style="font-size:8px">[Adm No.]</span></th>
                                <th style="width:45px" data-default-width="45px">Class<br>Roll No.</th>
                                <th style="width:42px" data-default-width="42px">Photo</th>
                                <th style="width:99px" data-default-width="99px">Board<br>RR No.</th>
                                <th style="width:183px" data-default-width="183px">Student's Name</th>
                                <th style="width:${className.includes('12') ? '140px' : '200px'}" data-default-width="${className.includes('12') ? '140px' : '200px'}">Parentage<br><span style="font-size:7px">(Father's Name / Mother's Name)</span></th>
                                <th style="width:75px" data-default-width="75px">Date of Birth</th>
                                <th style="width:42px" data-default-width="42px">Subs.</th>
                                <th style="width:85px" data-default-width="85px">${className.includes('12') ? 'Present' : 'Board'}<br>Roll No.</th>
                                <th style="width:90px" data-default-width="90px">Result</th>
                                <th style="width:40px; font-size:8px;" data-default-width="40px">Admit Card<br>Receipt</th>
                                <th style="font-size:8px;">${className.includes('12') ? 'Receipts (Marks Card / 12th Cert.)' : 'Marks Card Receipt'}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${chunk.map(s => {
                    // Split RR No logic: 12 chars then remaining
                    const rr = String(s.boardReg || '');
                    const formattedRR = rr.length > 12 ? (`<div style="line-height:0.85;">` + rr.substring(0, 12) + '<br>' + rr.substring(12) + `</div>`) : rr;
                    
                    const getImgUrl = (url) => url ? (url.startsWith('http') ? url + (url.includes('?') ? '&' : '?') + 'cb=' + Date.now() : url) : '';
                    const photoUrl = getImgUrl(s.photo);
                    const sigUrl = getImgUrl(s.signature);

                    return `
                                <tr class="student-row">
                                    <td style="position:relative;">
                                        <strong>${s.sno}</strong>
                                        <span class="adm-no-small">[${s.admNo}]</span>
                                        <div class="row-resizer no-print"></div>
                                    </td>
                                    <td style="font-size:14px; font-weight:800; color:var(--primary); text-align:center;">${s.classRoll}</td>
                                     <td class="photo-cell" style="padding:0 !important; height:1px;">${photoUrl ? `<img src="${photoUrl}" />` : ''}</td>
                                     <td style="font-size:13px; font-weight:700; line-height:1.1">${formattedRR}</td>
                                     <td style="text-align:left; padding-left:10px; font-size:14px; font-weight:700; text-transform:uppercase;">${s.name}</td>
                                     <td style="text-align:left; font-size:13px; padding-left:8px; line-height:1.2; text-transform:uppercase;">
                                         <div style="border-bottom:1px solid #eee; margin-bottom:2px; padding-bottom:2px;">${s.father.toUpperCase()}</div>
                                         <div style="color:#666">${s.mother.toUpperCase()}</div>
                                     </td>
                                     <td style="font-size:13px">${s.dob}</td>
                                     <td style="font-size:10px; line-height:1">${s.subs.split(',').join('<br>')}</td>
                                     <td style="font-size:15px; font-weight:700">${s.boardRoll}</td>
                                     <td style="font-size:14px">${s.result}</td>
                                     <td class="sig-box-cell" style="width:40px; text-align:center; vertical-align:middle; padding: 0;">
                                         ${sigUrl ? `<img src="${sigUrl}" style="transform: rotate(180deg); width:100%; height:100%; min-height:calc(var(--sig-height) - 4px); object-fit:fill; display:block;">` : ''}
                                     </td>
                                    <td class="receipt-cell">
                                        ${className.includes('12') ? `
                                            <div style="display:flex; gap:20px; line-height: 1.3;">
                                                <div class="receipt-item" style="flex:1; border-right:1px dashed #ccc; padding-right:10px;">
                                                    <div style="font-size:7.5px; font-weight:800; margin-bottom:4px;">Marks Card & CC/DC received</div>
                                                    <div style="font-size:7.5px; margin-bottom:10x;">today ____________</div>
                                                    <div style="height:10px;"></div>
                                                    <div style="font-size:7.5px;">Sig. ______________</div>
                                                </div>
                                                <div class="receipt-item" style="flex:1;">
                                                    <div style="font-size:7.5px; font-weight:800; margin-bottom:4px;">Qual. Cert. received vide S.No.</div>
                                                    <div style="font-size:7.5px; margin-bottom:4px;">today ____________</div>
                                                    <div style="height:10px;"></div>
                                                    <div style="font-size:7.5px;">Sig. ______________</div>
                                                </div>
                                            </div>
                                        ` : `
                                            <div class="receipt-item" style="height:100%; display:flex; flex-direction:row; align-items:flex-end; justify-content:space-around; padding: 0 10px 4px; min-height:calc(var(--row-height) - 5px);">
                                                <div style="font-size:9px;">Sig. _______________</div>
                                                <div style="font-size:9px;">Date: ______________</div>
                                            </div>
                                        `}
                                    </td>
                                </tr>`;
                }).join('')}
                        </tbody>
                    </table>
                    <div class="footer-sigs" style="margin-top: 15px;">
                        <div class="sig-box"><div class="sig-label">In charge</div></div>
                        <div class="sig-box"><div class="sig-label">Checked by</div></div>
                        <div class="sig-box"><div class="sig-label">Principal</div></div>
                    </div>
                `;
                root.appendChild(p);
            });

            // INITIALIZE RESIZERS
            setTimeout(() => {
                initResizers();
                initRowResizers();
            }, 500);
        }

        // COLUMN RESIZING LOGIC
        function initResizers() {
            const ths = document.querySelectorAll('thead th');
            ths.forEach(th => {
                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                th.appendChild(resizer);

                resizer.addEventListener('mousedown', function (e) {
                    const startX = e.pageX;
                    const startWidth = th.offsetWidth;
                    th.classList.add('resizing');

                    const colId = th.textContent.trim().split('\n')[0];
                    const isSubHeader = th.parentElement.style.background === 'rgb(238, 238, 238)'; // Match #eee

                    const onMouseMove = (e) => {
                        const width = startWidth + (e.pageX - startX);
                        th.style.width = width + 'px';
                        syncColumnWidth(colId, width, isSubHeader);
                    };

                    const onMouseUp = () => {
                        th.classList.remove('resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        function syncColumnWidth(id, width, isSub) {
            const allThs = document.querySelectorAll('thead th');
            allThs.forEach(th => {
                const thisId = th.textContent.trim().split('\n')[0];
                if (thisId === id) {
                    th.style.width = width + 'px';
                }
            });
        }

        function resetLayout() {
            if (!confirm("Reset all column widths and row heights to default?")) return;
            // Reset heights
            document.documentElement.style.setProperty('--row-height', '98px');
            document.documentElement.style.setProperty('--sig-height', '78px');

            // Reset columns using data-default-width
            const ths = document.querySelectorAll('thead th');
            ths.forEach(th => {
                const dw = th.getAttribute('data-default-width');
                if (dw) th.style.width = dw;
                else th.style.width = '';
            });
        }

        // ROW RESIZING LOGIC
        function initRowResizers() {
            const resizers = document.querySelectorAll('.row-resizer');
            resizers.forEach(resizer => {
                resizer.addEventListener('mousedown', function (e) {
                    const tr = resizer.closest('tr');
                    const startY = e.pageY;
                    const startHeight = tr.offsetHeight;
                    const startPhotoHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-height')) || 98;
                    const startSigHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sig-height')) || 78;

                    tr.classList.add('row-resizing');

                    const onMouseMove = (e) => {
                        const diff = e.pageY - startY;
                        const newPhotoHeight = Math.max(50, startPhotoHeight + diff);
                        const newSigHeight = Math.max(30, startSigHeight + diff);

                        document.documentElement.style.setProperty('--row-height', newPhotoHeight + 'px');
                        document.documentElement.style.setProperty('--sig-height', newSigHeight + 'px');
                    };

                    const onMouseUp = () => {
                        tr.classList.remove('row-resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }
    </script>
</body>

</html>
