<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="%PUBLIC_URL%/error-guard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <!-- Preload the hero slide image — the single most impactful LCP resource -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/slides/6.jpg" fetchpriority="high" />
    <!-- Google Fonts (Plus Jakarta Sans, Inter, Outfit, Playfair Display, Cinzel) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Cinzel:wght@600;700;800&display=swap" />

    <meta name="application-name" content="HSS Shangus" />
    <meta name="apple-mobile-web-app-title" content="HSS Shangus" />
    
    <!-- Apple Touch Icon and Favicons (compliant with Google Search 48px square multiples) -->
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>HSS Shangus</title>
    <meta name="google-site-verification" content="XjLLUaQ6VZuVap1Thy3hwSWITUxGFwbn5kCifk_0IgE" />
  </head>
  <body>
    <div id="root"><p style="padding:2rem;font-family:'Plus Jakarta Sans','Inter',sans-serif">Loading HSS Shangus…</p></div>
    <noscript>Enable JavaScript for online services. Public page overviews are included in the production build.</noscript>
  </body>
</html>
