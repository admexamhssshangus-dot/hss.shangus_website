<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Govt. Higher Secondary School Shangus</title>
    <meta name="description" content="Official website of Govt HSS Shangus. Admissions, Academics, and secure Student/Teacher portal." />
    <meta name="google-site-verification" content="XjLLUaQ6VZuVap1Thy3hwSWITUxGFwbn5kCifk_0IgE" />
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Govt. Higher Secondary School Shangus" />
    <meta property="og:description" content="Govt HSS Shangus — Science, Humanities & Secondary education in Anantnag. Admissions and academic programs." />
    <meta property="og:image" content="%PUBLIC_URL%/images/og-image.svg" />
    <meta property="og:url" content="https://your-school-domain.example/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Govt. Higher Secondary School Shangus" />
    <meta name="twitter:description" content="Govt HSS Shangus — Science, Humanities & Secondary education in Anantnag." />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/og-image.svg" />

    <!-- Structured data: Organization and WebSite (update URLs/logo to your real host) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Govt HSS Shangus",
      "url": "https://your-school-domain.example/",
      "logo": "%PUBLIC_URL%/images/logo-512.svg",
      "telephone": "+91-0000000000",
      "contactPoint": [{
        "@type": "ContactPoint",
        "telephone": "+91-0000000000",
        "contactType": "administration"
      }],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Main Road, Shangus",
        "addressLocality": "Anantnag",
        "addressRegion": "J&K",
        "postalCode": "192201",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://www.facebook.com/yourpage",
        "https://twitter.com/yourhandle"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://your-school-domain.example/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://your-school-domain.example/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
